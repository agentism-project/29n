<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historia 9:16 Vivienda, propuesta Tarjetas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; padding: 150px 72px 150px; display: flex; flex-direction: column; background: #f1f1ef; color: #141414; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden;">
  <header style="display: flex; flex-direction: column; align-items: flex-start; gap: 22px; padding-bottom: 20px;">
    <span style="display: flex; align-items: center; height: 60px; padding: 0 28px; border-radius: 999px; background: #ffffff; font-size: 26px; font-weight: 600; color: #3d3d3d;">Elecciones generales · 29-N</span>
    <div style="display: flex; align-items: center; gap: 28px;">
      <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 112px; height: 112px; border-radius: 32px; background: #ffffff; color: #141414;"><svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg></span>
      <h1 style="margin: 0; font-size: 104px; line-height: 110px; font-weight: 700; letter-spacing: -0.02em;">Vivienda</h1>
    </div>
    <p style="margin: 0; font-size: 34px; line-height: 42px; color: #444444;">Qué propone cada partido, en una línea</p>
  </header>
  <div style="display: flex; justify-content: space-between; padding: 16px 12px 12px; font-size: 26px; line-height: 32px; font-weight: 600; color: #4d4d4d;"><span>Partidos estatales</span><span>5</span></div>
  <section style="display: flex; flex-direction: column; padding: 8px 32px; border-radius: 36px; background: #ffffff;">
    <sc-for list="{{estatales}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; align-items: center; gap: 22px; height: 72px; border-bottom: {{p.bb}};">
        <span aria-hidden="true" style="flex-shrink: 0; width: 18px; height: 18px; border-radius: 999px; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15); background: {{p.color}};"></span>
        <span style="display: flex; flex-direction: column; min-width: 0;">
          <span style="font-size: 22px; line-height: 26px; font-weight: 600; color: #555555;">{{p.name}}</span>
          <span style="font-size: 32px; line-height: 38px; font-weight: {{p.fw}}; font-style: {{p.fs}}; color: {{p.hc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.head}}</span>
        </span>
      </div>
    </sc-for>
  </section>
  <div style="display: flex; justify-content: space-between; padding: 24px 12px 12px; font-size: 26px; line-height: 32px; font-weight: 600; color: #4d4d4d;"><span>Partidos territoriales</span><span>7</span></div>
  <section style="display: flex; flex-direction: column; padding: 8px 32px; border-radius: 36px; background: #ffffff;">
    <sc-for list="{{territoriales}}" as="p" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 22px; height: 72px; border-bottom: {{p.bb}};">
        <span aria-hidden="true" style="flex-shrink: 0; width: 18px; height: 18px; border-radius: 999px; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.15); background: {{p.color}};"></span>
        <span style="display: flex; flex-direction: column; min-width: 0;">
          <span style="font-size: 22px; line-height: 26px; font-weight: 600; color: #555555;">{{p.name}}</span>
          <span style="font-size: 32px; line-height: 38px; font-weight: {{p.fw}}; font-style: {{p.fs}}; color: {{p.hc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.head}}</span>
        </span>
      </div>
    </sc-for>
  </section>
  <footer style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 32px; padding: 32px; border-radius: 36px; background: #ffffff;">
    <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
      <span style="font-size: 28px; line-height: 36px; color: #444444;">Cita literal y página de cada propuesta en</span>
      <span style="font-size: 50px; line-height: 58px; font-weight: 700; letter-spacing: -0.01em; color: #141414;">ejemplo.github.io/29n</span>
      <span style="font-size: 23px; line-height: 30px; color: #555555;">Fuente: programas oficiales 29-N · actualizado el 18/11</span>
    </div>
    <div role="img" aria-label="Código QR de la web (marcador)" style="flex-shrink: 0; width: 170px; height: 170px; box-sizing: border-box; border: 3px solid #141414; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 700; color: #141414;">QR</div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, color, head, opts) => {
      const o = opts || {};
      return {
        name: name, color: color, head: head,
        hc: o.state ? '#5f5f5f' : '#141414',
        fs: o.state ? 'italic' : 'normal',
        fw: o.state ? '400' : '500',
        bb: o.last ? 'none' : '2px solid #ececea'
      };
    };
    return {
      estatales: [
        row('Partido A', '#1f5fbf', 'Propuesta de ejemplo sobre alquiler'),
        row('Partido B', '#d62828', 'Ejemplo sobre vivienda pública'),
        row('Partido C', '#2a9d3f', 'Ejemplo de ayuda a compra joven'),
        row('Partido D', '#7b3fa0', 'Propuesta de ejemplo sobre suelo'),
        row('Partido E', '#e07a1f', 'Ejemplo de medida fiscal', { last: true })
      ],
      territoriales: [
        row('Partido F', '#d9a400', 'Ejemplo de plan de vivienda propio'),
        row('Partido G', '#00838f', 'Ejemplo sobre alquiler social'),
        row('Partido H', '#c2185b', 'El programa no trata este tema', { state: true }),
        row('Partido I', '#6d4c41', 'Ejemplo sobre rehabilitación'),
        row('Partido J', '#3f51b5', 'Programa aún no publicado', { state: true }),
        row('Partido K', '#7cb342', 'Ejemplo sobre pisos turísticos'),
        row('Partido L', '#546e7a', 'Ejemplo sobre desahucios', { last: true })
      ]
    };
  }
}
</script>
</body>
</html>
