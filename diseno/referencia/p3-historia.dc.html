<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Historia 9:16 Vivienda, propuesta Alto contraste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#f5f5f5}a:hover{color:#ffffff}
</style>
</helmet>
<div style="width: 1080px; height: 1920px; box-sizing: border-box; padding: 150px 80px 150px; display: flex; flex-direction: column; background: #0a0a0a; color: #f5f5f5; font-family: Inter, system-ui, sans-serif; overflow: hidden;">
  <header style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 24px; border-bottom: 6px solid #f5f5f5;">
    <span style="font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #a6a6a6;">29-N · Qué propone cada partido</span>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 168px; line-height: 150px; font-weight: 700; letter-spacing: -0.03em; text-transform: uppercase;">Vivienda</h1>
  </header>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 28px 0 10px;"><span style="padding: 6px 14px; background: #f5f5f5; color: #0a0a0a; font-family: 'Space Grotesk', sans-serif; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">Partidos estatales</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; color: #a6a6a6;">05</span></div>
  <sc-for list="{{estatales}}" as="p" hint-placeholder-count="5">
    <div style="display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 26px; align-items: center; height: 76px; border-bottom: 2px solid #262626;">
      <span aria-hidden="true" style="width: 22px; height: 22px; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); background: {{p.color}};"></span>
      <span style="display: flex; flex-direction: column; min-width: 0;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; line-height: 26px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a6a6a6;">{{p.name}}</span>
        <span style="font-size: 34px; line-height: 40px; font-weight: {{p.fw}}; font-style: {{p.fs}}; color: {{p.hc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.head}}</span>
      </span>
    </div>
  </sc-for>
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 28px 0 10px;"><span style="padding: 6px 14px; background: #f5f5f5; color: #0a0a0a; font-family: 'Space Grotesk', sans-serif; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">Partidos territoriales</span><span style="font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; color: #a6a6a6;">07</span></div>
  <sc-for list="{{territoriales}}" as="p" hint-placeholder-count="7">
    <div style="display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 26px; align-items: center; height: 76px; border-bottom: 2px solid #262626;">
      <span aria-hidden="true" style="width: 22px; height: 22px; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); background: {{p.color}};"></span>
      <span style="display: flex; flex-direction: column; min-width: 0;">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; line-height: 26px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #a6a6a6;">{{p.name}}</span>
        <span style="font-size: 34px; line-height: 40px; font-weight: {{p.fw}}; font-style: {{p.fs}}; color: {{p.hc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.head}}</span>
      </span>
    </div>
  </sc-for>
  <footer style="margin-top: auto; padding-top: 28px; border-top: 2px solid #3a3a3a; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px;">
    <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
      <span style="font-size: 28px; line-height: 36px; color: #d9d9d9;">Cita literal y página de cada propuesta en</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 54px; line-height: 60px; font-weight: 700; color: #f5f5f5;">ejemplo.github.io/29n</span>
      <span style="font-size: 24px; line-height: 32px; color: #a6a6a6;">Fuente: programas oficiales 29-N · actualizado el 18/11</span>
    </div>
    <div role="img" aria-label="Código QR de la web (marcador)" style="flex-shrink: 0; width: 180px; height: 180px; box-sizing: border-box; border: 4px solid #f5f5f5; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-size: 36px; font-weight: 700; color: #f5f5f5;">QR</div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1920}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, color, head, state) => ({
      name: name, color: color, head: head,
      hc: state ? '#a6a6a6' : '#f5f5f5',
      fs: state ? 'italic' : 'normal',
      fw: state ? '400' : '500'
    });
    return {
      estatales: [
        row('Partido A', '#2f73d9', 'Propuesta de ejemplo sobre alquiler'),
        row('Partido B', '#e63939', 'Ejemplo sobre vivienda pública'),
        row('Partido C', '#33b04f', 'Ejemplo de ayuda a compra joven'),
        row('Partido D', '#9b59c4', 'Propuesta de ejemplo sobre suelo'),
        row('Partido E', '#f08a2c', 'Ejemplo de medida fiscal')
      ],
      territoriales: [
        row('Partido F', '#f0c419', 'Ejemplo de plan de vivienda propio'),
        row('Partido G', '#19a7b3', 'Ejemplo sobre alquiler social'),
        row('Partido H', '#e0457b', 'El programa no trata este tema', true),
        row('Partido I', '#a1775f', 'Ejemplo sobre rehabilitación'),
        row('Partido J', '#6576d6', 'Programa aún no publicado', true),
        row('Partido K', '#8fc152', 'Ejemplo sobre pisos turísticos'),
        row('Partido L', '#8aa1ad', 'Ejemplo sobre desahucios')
      ]
    };
  }
}
</script>
</body>
</html>
