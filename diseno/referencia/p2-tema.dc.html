<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vivienda, propuesta Tarjetas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141414}a:hover{color:#000000}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 16px 12px; display: flex; flex-direction: column; background: #f1f1ef; color: #141414; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden;">
  <header style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 12px;">
    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
      <span style="display: flex; align-items: center; height: 32px; padding: 0 12px; border-radius: 999px; background: #ffffff; font-size: 13px; font-weight: 600; color: #3d3d3d;">29-N · ¿Qué proponen?</span>
      <button type="button" aria-label="Dónde votas: Toda España" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border: 1px solid #cfcfcb; border-radius: 999px; background: #ffffff; color: #141414; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;">Toda España<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"></path></svg></button>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <span aria-hidden="true" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 14px; background: #ffffff; color: #141414;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"></path><path d="M5 9.5V21h14V9.5"></path><path d="M10 21v-6h4v6"></path></svg></span>
      <h1 style="margin: 0; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -0.01em;">Vivienda</h1>
    </div>
  </header>
  <div style="display: flex; justify-content: space-between; padding: 4px 6px 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: #4d4d4d;"><span>Partidos estatales</span><span>5</span></div>
  <section aria-label="Partidos estatales" style="display: flex; flex-direction: column; padding: 4px 14px; border-radius: 18px; background: #ffffff;">
    <sc-for list="{{estatales}}" as="p" hint-placeholder-count="5">
      <a href="{{p.href}}" style="display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: {{p.bb}}; text-decoration: none; color: #141414;">
        <span aria-hidden="true" style="flex-shrink: 0; width: 10px; height: 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); background: {{p.color}};"></span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;">
          <span style="font-size: 12px; line-height: 15px; font-weight: 600; color: #555555;">{{p.name}}</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: {{p.fw}}; font-style: {{p.fs}}; color: {{p.hc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.head}}</span>
        </span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 3l5 5-5 5"></path></svg>
      </a>
    </sc-for>
  </section>
  <div style="display: flex; justify-content: space-between; padding: 14px 6px 8px; font-size: 13px; line-height: 18px; font-weight: 600; color: #4d4d4d;"><span>Partidos territoriales</span><span>7</span></div>
  <section aria-label="Partidos territoriales" style="display: flex; flex-direction: column; padding: 4px 14px; border-radius: 18px; background: #ffffff;">
    <sc-for list="{{territoriales}}" as="p" hint-placeholder-count="7">
      <a href="{{p.href}}" style="display: flex; align-items: center; gap: 12px; height: 44px; border-bottom: {{p.bb}}; text-decoration: none; color: #141414;">
        <span aria-hidden="true" style="flex-shrink: 0; width: 10px; height: 10px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); background: {{p.color}};"></span>
        <span style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0;">
          <span style="font-size: 12px; line-height: 15px; font-weight: 600; color: #555555;">{{p.name}}</span>
          <span style="font-size: 16px; line-height: 20px; font-weight: {{p.fw}}; font-style: {{p.fs}}; color: {{p.hc}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{p.head}}</span>
        </span>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#8a8a8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M6 3l5 5-5 5"></path></svg>
      </a>
    </sc-for>
  </section>
  <footer style="margin-top: auto; padding-top: 8px; text-align: center; font-size: 11.5px; line-height: 15px; color: #4d4d4d;">Fuente: programas oficiales 29-N · actualizado el 18/11<br><span style="font-weight: 700; color: #141414;">ejemplo.github.io/29n</span></footer>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, color, head, opts) => {
      const o = opts || {};
      return {
        name: name, color: color, head: head,
        hc: o.state ? '#5f5f5f' : '#141414',
        fs: o.state ? 'italic' : 'normal',
        fw: o.state ? '400' : '500',
        bb: o.last ? 'none' : '1px solid #ececea',
        href: name === 'Partido C' ? 'p2-ficha.dc.html' : '#'
      };
    };
    return {
      estatales: [
        row('Partido A', '#1f5fbf', 'Propuesta de ejemplo sobre alquiler'),
        row('Partido B', '#d62828', 'Ejemplo sobre vivienda pública'),
        row('Partido C', '#2a9d3f', 'Ejemplo de ayuda a compra joven'),
        row('Partido D', '#7b3fa0', 'Propuesta de ejemplo sobre suelo'),
        row('Partido E', '#e07a1f', 'Ejemplo de medida fiscal', { last: true })
      ],
      territoriales: [
        row('Partido F', '#d9a400', 'Ejemplo de plan de vivienda propio'),
        row('Partido G', '#00838f', 'Ejemplo sobre alquiler social'),
        row('Partido H', '#c2185b', 'El programa no trata este tema', { state: true }),
        row('Partido I', '#6d4c41', 'Ejemplo sobre rehabilitación'),
        row('Partido J', '#3f51b5', 'Programa aún no publicado', { state: true }),
        row('Partido K', '#7cb342', 'Ejemplo sobre pisos turísticos'),
        row('Partido L', '#546e7a', 'Ejemplo sobre desahucios', { last: true })
      ]
    };
  }
}
</script>
</body>
</html>
